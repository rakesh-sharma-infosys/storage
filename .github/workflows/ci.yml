name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    name: Test and validate (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Validate syntax
        shell: bash
        run: |
          for f in $(git ls-files '*.js'); do
            node --check "$f"
          done

      - name: Validate package entry point loads
        run: node -e "require('.')"

      - name: Unit tests
        run: npm test

      - name: Performance tests (reduced record count)
        run: npm run test:perf
        env:
          PERF_RECORDS: "20000"
